spring.application.name=transaction-service
server.port=8082
spring.config.import=optional:configserver:http://localhost:8888
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
spring.datasource.url=jdbc:h2:mem:transaction-db
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.graphql.graphiql.enabled=true
spring.ai.mcp.server.name=transaction-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.kafka.bootstrap-servers=localhost:9092
management.endpoints.web.exposure.include=*
bank.kafka.topic.transactions=bank.transactions.created
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=3000
