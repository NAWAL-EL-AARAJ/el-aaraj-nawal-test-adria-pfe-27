spring.application.name=ai-agent-service
server.port=8084
spring.config.import=optional:configserver:http://localhost:8888
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# --- LLM : API compatible OpenAI (Groq par défaut) ---
spring.ai.openai.base-url=${LLM_BASE_URL:https://api.groq.com/openai/v1}
spring.ai.openai.api-key=${GROQ_API_KEY:changeme}
spring.ai.openai.chat.options.model=${LLM_MODEL:openai/gpt-oss-120b}

# --- Client MCP : outils exposés par account-service et transaction-service ---
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.streamable-http.connections.account-service.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.transaction-service.url=http://localhost:8082

# --- Bot Telegram (long polling), activé seulement si TELEGRAM_BOT_TOKEN est défini ---
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}
telegram.bot.polling-timeout-seconds=30

management.endpoints.web.exposure.include=*
