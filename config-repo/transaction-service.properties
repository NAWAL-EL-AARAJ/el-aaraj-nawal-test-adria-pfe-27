server.port=8082
spring.datasource.url=jdbc:h2:mem:transaction-db
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.kafka.bootstrap-servers=localhost:9092
bank.kafka.topic.transactions=bank.transactions.created

# --- Feign ---
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# --- Resilience4J : circuit breaker ---
resilience4j.circuitbreaker.instances.accountService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.accountService.sliding-window-size=10
resilience4j.circuitbreaker.instances.accountService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.accountService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.accountService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.accountService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.accountService.register-health-indicator=true
resilience4j.circuitbreaker.instances.accountService.ignore-exceptions=ma.enset.transactionservice.service.exception.AccountNotFoundException,ma.enset.transactionservice.service.exception.AccountOperationRejectedException

# --- Resilience4J : retry (lecture du compte uniquement) ---
resilience4j.retry.instances.accountService.max-attempts=3
resilience4j.retry.instances.accountService.wait-duration=500ms
resilience4j.retry.instances.accountService.ignore-exceptions=ma.enset.transactionservice.service.exception.AccountNotFoundException,ma.enset.transactionservice.service.exception.AccountOperationRejectedException,io.github.resilience4j.circuitbreaker.CallNotPermittedException,ma.enset.transactionservice.service.exception.AccountServiceCircuitOpenException

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,refresh,circuitbreakers,circuitbreakerevents,retries,retryevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
# un circuit ouvert reste visible dans /actuator/health sans marquer le service DOWN
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,CIRCUIT_OPEN,UP,UNKNOWN
management.endpoint.health.status.http-mapping.CIRCUIT_OPEN=200
